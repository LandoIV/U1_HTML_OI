<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Index.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <img src="./logo_empresa_letra_v1.png" alt="Logo SportClub" class="logo">
            <h1>SportClub</h1>
            <p class="subtitle">Tu mejor versión comienza hoy</p>

            <!-- Mensaje de error -->
            <div id="errorMsg" style="
                display:none;
                background:#fee2e2;
                border:1px solid #f87171;
                color:#b91c1c;
                padding:10px 14px;
                border-radius:8px;
                font-size:13px;
                margin-bottom:15px;
                text-align:left;
            "></div>

            <form id="loginForm">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="********" required>

                <button type="submit" class="btn btn-login" id="btnLogin">Ingresar</button>
            </form>

            <div class="links">
                <a href="./Recover.html">¿Olvidaste tu contraseña?</a>
                <a href="./registro.html">Crear una cuenta</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';

        function mostrarError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function ocultarError() {
            document.getElementById('errorMsg').style.display = 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            ocultarError();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('btnLogin');

            if (!email || !password) {
                mostrarError('Por favor completa todos los campos.');
                return;
            }

            btn.textContent = 'Ingresando...';
            btn.disabled    = true;

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (!response.ok || !result.ok) {
                    mostrarError(result.message || 'Credenciales incorrectas.');
                    return;
                }

                localStorage.setItem('token', result.data.token);
                localStorage.setItem('user',  JSON.stringify(result.data.user));

                const rol = result.data.user.role;
                if      (rol === 'admin') window.location.href = './InterfazAdmin.html';
                else if (rol === 'coach') window.location.href = './InterfazCoach.html';
                else                     window.location.href = './InterfazUsuario.html';

            } catch (err) {
                mostrarError('No se pudo conectar con el servidor. Verifica que el backend esté activo.');
            } finally {
                btn.textContent = 'Ingresar';
                btn.disabled    = false;
            }
        });
    </script>

</body>
</html>
