<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Recuperar Contraseña</title>
    <link rel="stylesheet" href="Recover.css">
    <style>
        .campo-error { border-color: #f87171 !important; }
        .msg-error { color:#f87171; font-size:11px; margin-top:-14px; margin-bottom:10px; display:none; }
        .msg-error.visible { display:block; }
        #mensaje {
            padding:13px; border-radius:12px; font-size:13px; text-align:center;
            margin-bottom:18px; display:none;
        }
        #mensaje.success { background:rgba(16,185,129,.2); border:1px solid #10b981; color:#d1fae5; }
        #mensaje.error   { background:rgba(239,68,68,.2);  border:1px solid #ef4444;  color:#fecaca; }
    </style>
</head>
<body>

    <div class="caja">
        <img id="imagen-logo" src="./logo_empresa_letra_v1.png" alt="SportClub">

        <h3>Recuperar Acceso</h3>
        <p style="font-size:13px;color:#ccc;margin-bottom:20px;text-align:center;">
            Introduce tu correo para enviarte las instrucciones.
        </p>

        <div id="mensaje"></div>

        <label>Correo Electrónico</label>
        <input type="email" id="emailRecuperar" placeholder="ejemplo@correo.com">
        <span class="msg-error" id="errEmail">Ingresa un correo válido.</span>

        <button id="boton-inicio">ENVIAR ENLACE</button>

        <div class="links" style="justify-content:center;">
            <a href="./index.html">Volver al Login</a>
        </div>
    </div>

    <script>
        document.getElementById('boton-inicio').addEventListener('click', function() {
            const emailEl = document.getElementById('emailRecuperar');
            const errEl   = document.getElementById('errEmail');
            const msgEl   = document.getElementById('mensaje');

            emailEl.classList.remove('campo-error');
            errEl.classList.remove('visible');
            msgEl.style.display = 'none';

            const email = emailEl.value.trim();
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailEl.classList.add('campo-error');
                errEl.classList.add('visible');
                return;
            }

            // Simulación (el backend no expone endpoint de recuperación en el README)
            msgEl.textContent    = 'Se ha enviado un enlace de recuperación a tu correo.';
            msgEl.className      = 'success';
            msgEl.style.display  = 'block';
            emailEl.value        = '';
        });
    </script>

</body>
</html>
